name = "bet-counter"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "f90d1d21e633d2e442a188f2d70b1541"
workers_dev = false
routes = [{ pattern = "bet-api.xjack.tw", custom_domain = true }]

# 準時觸發每日更新（目前沒開，要先放 Worker secret GH_TOKEN，見 README「每日更新排程」）：
# 週一到週五 15:40、18:40（台北時間）觸發 GitHub Actions，後者是備援。
# Cloudflare 的 cron 用 UTC；星期用英文縮寫，因為這裡數字 1 是星期日，跟一般 cron 不同。
# [triggers]
# crons = ["40 7 * * MON-FRI", "40 10 * * MON-FRI"]

[[d1_databases]]
binding = "DB"
database_name = "bet-counter"
database_id = "41cc014c-7448-47a6-9902-400b97c3bcd6"
